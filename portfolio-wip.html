
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f6f2">

  <title>Under Maintenance — Nilo Yeo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f6f2;
      color: #252525;
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 32px 5%;
    }

    .site-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    main {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 500;
      letter-spacing: -2px;
    }

    .description {
      margin: 20px auto 0;
      max-width: 380px;
      font-size: 14px;
      line-height: 1.7;
      color: #777;
    }

    .description a {
      color: #252525;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .description a:hover {
      color: #C77C60;
    }

    .planet {
      width: 100px;
      height: 100px;
      margin: 0 auto 32px;
      overflow: visible;
    }

    .orbit {
      transform-origin: 50px 50px;
      animation: orbit 6s linear infinite;
    }

    @keyframes orbit {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .orbit {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="site-title">Nilo Yeo.</div>
  </header>

  <main>
    <div class="content">

      <!-- Planet and orbiting moon -->
      <svg
        class="planet"
        viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-label="A small planet with a moon orbiting around it"
      >
        <!-- Planet -->
        <circle
          cx="50"
          cy="50"
          r="21"
          fill="#C77C60"
        />

        <!-- Planet detail -->
        <path
          d="M34 46 Q44 38 56 43 T67 49"
          stroke="#E8AE91"
          stroke-width="2"
          fill="none"
          opacity=".7"
        />

        <!-- Moon orbit -->
        <g class="orbit">
          <ellipse
            cx="50"
            cy="50"
            rx="43"
            ry="17"
            fill="none"
            stroke="#252525"
            stroke-width="1"
            stroke-dasharray="2 4"
            opacity=".35"
            transform="rotate(-48 50 50)"
          />

          <!-- Moon -->
          <circle
            cx="93"
            cy="50"
            r="5"
            fill="#252525"
          />
        </g>
      </svg>

      <h1>Under maintenance.</h1>
      <p class="description">
        My portfolio is currently undergoing a little refresh.
        In the meantime, you can find me at
        <a href="https://komunitydesign.com/" target="_blank"
          rel="noopener noreferrer">Komunity Design</a>.
      </p>

    </div>
  </main>

</body>
</html>
